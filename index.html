<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Farm - 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9e3cc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #clock {
            font-size: 32px;
            font-weight: bold;
            color: #7c8a04;
            background: rgba(249, 227, 204, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid #daa056;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            border: 1px solid #000;
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(245, 204, 186, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
        }
        button {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #daa056;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="clock">0:00</div>
    </div>
    <div id="crosshair"></div>
    <div id="start-screen">
        <h1 style="color: #7c8a04; font-size: 48px;">Soft Farm</h1>
        <p style="color: #333; font-size: 18px;">Move mouse to aim. Click and hold to spray fertilizer.</p>
        <button id="start-btn">Click to Start</button>
    </div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Palette
        const C_WEEDS = 0x7c8a04;
        const C_SKY_TOP = 0xf9e3cc;
        const C_SKY_BOT = 0xf5ccba;
        const C_BUILDINGS = 0xc2cada;
        const C_SUN = 0xdaa056;
        const C_DIRT = 0xa37b45;

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(C_SKY_BOT);
        scene.fog = new THREE.Fog(C_SKY_BOT, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        // Low angle first-person
        camera.position.set(0, 1.2, 5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(C_SKY_TOP, 0.6);
        scene.add(ambientLight);

        // Sun light facing away from character (illuminating from behind player)
        const dirLight = new THREE.DirectionalLight(C_SUN, 1.2);
        dirLight.position.set(-5, 10, 15);
        dirLight.castShadow = true;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Environment (Farm Ground)
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: C_DIRT, roughness: 1.0 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Background Scenery (Houses, Buildings, Light Poles)
        const sceneryGroup = new THREE.Group();
        const bldgMat = new THREE.MeshStandardMaterial({ color: C_BUILDINGS, roughness: 0.8 });
        
        function addHouse(x, z, w, h, d) {
            const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMat);
            box.position.set(x, h/2, z);
            box.castShadow = true;
            box.receiveShadow = true;
            
            const roof = new THREE.Mesh(new THREE.ConeGeometry(w*0.8, h*0.5, 4), new THREE.MeshStandardMaterial({color: 0x8a5a44}));
            roof.position.set(x, h + (h*0.5)/2, z);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            
            sceneryGroup.add(box);
            sceneryGroup.add(roof);
        }

        function addPole(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), bldgMat);
            pole.position.set(x, 3, z);
            pole.castShadow = true;
            
            const light = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: C_SUN}));
            light.position.set(x, 6, z + 0.5);
            sceneryGroup.add(pole);
            sceneryGroup.add(light);
        }

        // Place background objects clearly visible in distance
        addHouse(-8, -15, 4, 3, 4);
        addHouse(10, -20, 5, 4, 5);
        addHouse(-15, -25, 6, 5, 4);
        addPole(-4, -10);
        addPole(6, -12);
        addPole(-10, -18);
        scene.add(sceneryGroup);

        // Player / Gun Model
        const gunGroup = new THREE.Group();
        
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0, -0.4);
        
        const tankMat = new THREE.MeshStandardMaterial({ color: C_SUN, roughness: 0.3 });
        const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5), tankMat);
        tank.position.set(0, -0.15, -0.1);
        
        gunGroup.add(barrel);
        gunGroup.add(tank);
        
        // Lock gun to camera in first-person view
        gunGroup.position.set(0.4, -0.4, -0.8);
        camera.add(gunGroup);
        scene.add(camera);

        // Weeds System
        const weeds = [];
        const weedGeo = new THREE.ConeGeometry(0.3, 1, 6);
        // Translate geometry so scaling happens from the ground up
        weedGeo.translate(0, 0.5, 0); 
        const weedMat = new THREE.MeshStandardMaterial({ color: C_WEEDS, roughness: 0.9 });

        function spawnWeed() {
            const weed = new THREE.Mesh(weedGeo, weedMat);
            const x = (Math.random() - 0.5) * 20;
            const z = (Math.random() - 0.5) * 15 - 5; // Spawn in front of player
            weed.position.set(x, 0, z);
            weed.scale.setScalar(0.1); // Start small
            weed.castShadow = true;
            weed.receiveShadow = true;
            
            scene.add(weed);
            weeds.push({ mesh: weed, active: true, maxSize: 1 + Math.random() * 1.5 });
        }

        // Initial Weeds
        for (let i = 0; i < 40; i++) spawnWeed();

        // Mechanics & State
        let isShooting = false;
        let gameTime = 0;
        let isPlaying = false;
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);
        
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.05, 4, 4);
        const particleMat = new THREE.MeshBasicMaterial({ color: C_BUILDINGS });

        // Input Handling
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const uiClock = document.getElementById('clock');

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            isPlaying = true;
            clock.start();
        });

        window.addEventListener('mousedown', () => { if (isPlaying) isShooting = true; });
        window.addEventListener('mouseup', () => isShooting = false);

        // Pseudo mouse-look (Relaxed constraints)
        let targetRotX = 0;
        let targetRotY = 0;
        window.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const nx = (e.clientX / window.innerWidth) * 2 - 1;
            const ny = -(e.clientY / window.innerHeight) * 2 + 1;
            targetRotY = -nx * 0.8; 
            targetRotX = ny * 0.4;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const dt = clock.getDelta();
            gameTime += dt;

            // Camera Smoothing
            camera.rotation.y += (targetRotY - camera.rotation.y) * 5 * dt;
            camera.rotation.x += (targetRotX - camera.rotation.x) * 5 * dt;

            // Difficulty Logic
            let growthRate = 0.2;
            if (gameTime >= 55) {
                growthRate = 1.2;
                uiClock.style.color = '#d32f2f'; // Alert color
            } else if (gameTime >= 30) {
                growthRate = 0.6;
            }

            // Update UI
            if (gameTime < 60) {
                let s = Math.floor(gameTime);
                let display = `0:${(s % 60).toString().padStart(2, '0')}`;
                if (gameTime >= 55) {
                    display += ` (0:0${60 - s})`;
                }
                uiClock.innerText = display;
            } else {
                uiClock.innerText = "1:00 - Complete";
                isShooting = false;
                growthRate = 0;
            }

            // Continuous Weed Growth
            if (Math.random() < growthRate * dt * 2 && gameTime < 60) {
                spawnWeed();
            }

            weeds.forEach(w => {
                if (w.active && w.mesh.scale.y < w.maxSize) {
                    w.mesh.scale.addScalar(growthRate * dt);
                }
            });

            // Shooting Logic
            if (isShooting) {
                // Raycast to shrink weeds
                raycaster.setFromCamera(centerScreen, camera);
                const activeMeshes = weeds.filter(w => w.active).map(w => w.mesh);
                const intersects = raycaster.intersectObjects(activeMeshes);

                if (intersects.length > 0) {
                    const hitMesh = intersects[0].object;
                    const weedData = weeds.find(w => w.mesh === hitMesh);
                    if (weedData) {
                        weedData.mesh.scale.subScalar(3.0 * dt);
                        if (weedData.mesh.scale.y <= 0.1) {
                            weedData.active = false;
                            weedData.mesh.visible = false; // Hide completely
                        }
                    }
                }

                // Spawn visual fertilizer particles
                const p = new THREE.Mesh(particleGeo, particleMat);
                
                // Get gun nozzle world position
                const nozzlePos = new THREE.Vector3(0, 0, -0.8);
                gunGroup.localToWorld(nozzlePos);
                p.position.copy(nozzlePos);
                
                // Shoot towards raycast direction
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.add(new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, 0)); // Spread
                
                scene.add(p);
                particles.push({ mesh: p, dir: dir, life: 1.0 });
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.dir, 15 * dt);
                p.mesh.position.y -= 2 * dt; // Gravity
                p.life -= dt * 2;
                if (p.life <= 0 || p.mesh.position.y < 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
