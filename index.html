<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer Simulator 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            image-rendering: pixelated; 
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
        #clock {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            background: #000000;
            padding: 10px 20px;
            border: 4px solid #ffffff;
            display: inline-block;
        }
        #popup {
            margin-top: 15px;
            font-size: 28px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            transition: opacity 0.2s;
            text-align: left;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #000;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
            color: white;
            text-align: center;
        }
        h1 {
            color: #7c8a04; 
            font-size: 64px; 
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #000;
        }
        p {
            font-size: 20px; 
            margin-bottom: 30px; 
            line-height: 1.5;
            max-width: 600px;
        }
        button {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #7c8a04;
            color: white;
            border: 4px solid #ffffff;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
        }
        button:active {
            background-color: #5a6603;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="clock">0:00</div>
        <div id="popup">POWERUP!</div>
    </div>
    
    <div id="crosshair"></div>

    <div id="start-screen" class="overlay-screen">
        <h1>Fertilizer Simulator 3D</h1>
        <p>
            Survive 60 seconds. Spray mutated weeds before they grow too high.<br>
            Collect spinning blocks for powerups!<br><br>
            <strong>W A S D</strong> to move.<br>
            <strong>Mouse</strong> to look.<br>
            <strong>Left Click</strong> to spray.
        </p>
        <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 style="color: #ff0000;">Game Over</h1>
        <p>A weed grew too high.</p>
        <button onclick="location.reload()">Restart</button>
    </div>

    <div id="victory-screen" class="overlay-screen" style="display: none;">
        <h1 style="color: #00ff00;">Farm Saved!</h1>
        <p>Congratulations. You survived 60 seconds.</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const FATAL_WEED_SIZE = 4.0;
        const RENDER_SCALE = 0.25; 

        let playerSpeed = 15.0;
        let sprayRange = 14.0;
        let freezeTimer = 0;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth * RENDER_SCALE, window.innerHeight * RENDER_SCALE, false);
        renderer.domElement.style.width = '100vw';
        renderer.domElement.style.height = '100vh';
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap; 
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffdfaa, 1.2);
        dirLight.position.set(-20, 30, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Physics Colliders Array
        const colliders = [];

        function addCollider(obj) {
            obj.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(obj);
            colliders.push(box);
        }

        // Ground (Dirt)
        const groundGeo = new THREE.BoxGeometry(100, 1, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x5C4033 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        const sceneryGroup = new THREE.Group();

        // Sparse Grass Tufts
        const grassTuftGeo = new THREE.BoxGeometry(0.4, 0.2, 0.4);
        grassTuftGeo.translate(0, 0.1, 0);
        const grassTuftMat = new THREE.MeshLambertMaterial({ color: 0x4a6b10 });
        const grassTufts = new THREE.InstancedMesh(grassTuftGeo, grassTuftMat, 1500);
        const dummy = new THREE.Object3D();
        for(let i=0; i<1500; i++) {
            dummy.position.set((Math.random() - 0.5) * 90, 0, (Math.random() - 0.5) * 90);
            dummy.rotation.y = Math.random() * Math.PI;
            dummy.updateMatrix();
            grassTufts.setMatrixAt(i, dummy.matrix);
        }
        sceneryGroup.add(grassTufts);

        // Barn
        const barnBase = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 16), new THREE.MeshLambertMaterial({ color: 0x8b2b2b }));
        barnBase.position.set(-20, 4, -30);
        barnBase.castShadow = true;
        barnBase.receiveShadow = true;
        const barnRoof = new THREE.Mesh(new THREE.BoxGeometry(18, 4, 18), new THREE.MeshLambertMaterial({ color: 0x333333 }));
        barnRoof.position.set(-20, 10, -30);
        barnRoof.castShadow = true;
        sceneryGroup.add(barnBase, barnRoof);
        addCollider(barnBase);

        // Fences
        const fenceMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        function addFenceSegment(x, z, rot) {
            const f = new THREE.Group();
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.0, 0.6), fenceMat);
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.4, 0.2), fenceMat);
            rail1.position.set(2, 1.2, 0);
            const rail2 = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.4, 0.2), fenceMat);
            rail2.position.set(2, 0.5, 0);
            f.add(post, rail1, rail2);
            f.position.set(x, 1.0, z);
            f.rotation.y = rot;
            f.traverse(c => { if(c.isMesh) c.castShadow = true; });
            sceneryGroup.add(f);
            addCollider(f);
        }
        for(let i=0; i<6; i++) {
            addFenceSegment(10 + i*5, -10, 0); 
            addFenceSegment(10 + i*5, 20, 0);  
            addFenceSegment(10, -10 + i*5, Math.PI/2); 
            addFenceSegment(40, -10 + i*5, Math.PI/2); 
        }
        
        // Cows
        function createCow(x, z, rot) {
            const cow = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 2.4), new THREE.MeshLambertMaterial({ color: 0xFFFFFF }));
            body.position.y = 1.0;
            const spot1 = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            spot1.position.set(0, 1.0, 0.4);
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0), new THREE.MeshLambertMaterial({ color: 0xFFFFFF }));
            head.position.set(0, 1.6, 1.4);
            const legGeo = new THREE.BoxGeometry(0.4, 1.0, 0.4);
            const legMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const fl = new THREE.Mesh(legGeo, legMat); fl.position.set(0.5, 0.5, 0.9);
            const fr = new THREE.Mesh(legGeo, legMat); fr.position.set(-0.5, 0.5, 0.9);
            const bl = new THREE.Mesh(legGeo, legMat); bl.position.set(0.5, 0.5, -0.9);
            const br = new THREE.Mesh(legGeo, legMat); br.position.set(-0.5, 0.5, -0.9);
            cow.add(body, spot1, head, fl, fr, bl, br);
            cow.position.set(x, 0, z);
            cow.rotation.y = rot;
            cow.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            sceneryGroup.add(cow);
            addCollider(cow);
        }
        createCow(20, 5, Math.PI/4);
        createCow(30, 0, -Math.PI/3);
        createCow(25, 12, Math.PI);

        scene.add(sceneryGroup);

        // --- PLAYER SETUP ---
        const player = new THREE.Group();
        player.position.set(0, 0, 0);

        const pMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); 
        const sMat = new THREE.MeshLambertMaterial({ color: 0xffccaa }); 
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), pMat);
        body.position.y = 1.25;
        body.castShadow = true;
        
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), sMat);
        head.position.y = 2.25;
        head.castShadow = true;
        
        const armRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), sMat);
        armRight.position.set(0.7, 1.4, -0.4); 
        armRight.rotation.x = -Math.PI / 2;
        armRight.castShadow = true;

        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 1.5), new THREE.MeshLambertMaterial({ color: 0x333333 }));
        gun.position.set(0.7, 1.4, -1.0);
        gun.castShadow = true;
        const tank = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.5), new THREE.MeshLambertMaterial({ color: 0x00ff00 }));
        tank.position.set(0.7, 1.7, -0.7);

        player.add(body, head, armRight, gun, tank);
        scene.add(player);

        const cameraPivot = new THREE.Group();
        cameraPivot.position.set(0.8, 2.0, 0); 
        player.add(cameraPivot);
        
        camera.position.set(0, 0.5, 6); 
        camera.lookAt(0, 0, -10);
        cameraPivot.add(camera);

        const playerBoxSize = new THREE.Vector3(1.2, 2.5, 1.2); 
        const playerBox = new THREE.Box3();

        // --- WEEDS ---
        const weeds = [];
        const weedGeo = new THREE.BoxGeometry(1, 1, 1);
        weedGeo.translate(0, 0.5, 0); 
        const weedMat = new THREE.MeshLambertMaterial({ color: 0xFF00FF }); // High contrast Magenta
        let weedIdCounter = 0;

        function getValidSpawnPosition() {
            let valid = false;
            let x, z;
            let spawnBox = new THREE.Box3();
            let attempts = 0;
            while (!valid && attempts < 20) {
                x = (Math.random() - 0.5) * 60;
                z = (Math.random() - 0.5) * 60;
                spawnBox.setFromCenterAndSize(new THREE.Vector3(x, 1, z), new THREE.Vector3(2, 2, 2));
                valid = !colliders.some(c => spawnBox.intersectsBox(c));
                attempts++;
            }
            return { x, z };
        }

        function spawnWeed() {
            const weed = new THREE.Mesh(weedGeo, weedMat);
            const pos = getValidSpawnPosition();
            weed.position.set(pos.x, 0, pos.z);
            weed.scale.set(0.8, 0.2, 0.8);
            weed.castShadow = true;
            weed.receiveShadow = true;
            
            scene.add(weed);
            weeds.push({ mesh: weed, active: true, id: weedIdCounter++ });
        }

        for (let i = 0; i < 15; i++) spawnWeed();

        // --- POWERUPS ---
        const powerups = [];
        const puGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const mats = {
            'SPEED': new THREE.MeshLambertMaterial({ color: 0x0088ff }), 
            'RANGE': new THREE.MeshLambertMaterial({ color: 0xffff00 }), 
            'FREEZE': new THREE.MeshLambertMaterial({ color: 0x00ffff }), 
            'NUKE': new THREE.MeshLambertMaterial({ color: 0xff00ff })    
        };

        function spawnPowerup() {
            const r = Math.random();
            let type = 'SPEED';
            if (r > 0.9) type = 'NUKE';
            else if (r > 0.6) type = 'FREEZE';
            else if (r > 0.3) type = 'RANGE';

            const pu = new THREE.Mesh(puGeo, mats[type]);
            const pos = getValidSpawnPosition();
            pu.position.set(pos.x, 1.0, pos.z);
            scene.add(pu);
            powerups.push({ mesh: pu, type: type });
        }
        let nextPowerupTime = 5;

        let isShooting = false;
        let gameTime = 0;
        let isPlaying = false;
        let isGameOver = false;
        
        let alert30Triggered = false;
        let alert55Triggered = false;

        const clock = new THREE.Clock();
        
        const particles = [];
        const particleGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0x88ccff });

        let yaw = 0;
        let pitch = 0;
        const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };

        document.getElementById('start-btn').addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (isGameOver) return;
            if (document.pointerLockElement === document.body) {
                document.getElementById('start-screen').style.display = 'none';
                isPlaying = true;
                clock.start();
            } else {
                document.getElementById('start-screen').style.display = 'flex';
                isPlaying = false;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const sensitivity = 0.003;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, pitch)); 
            
            player.rotation.y = yaw;
            cameraPivot.rotation.x = pitch;
        });

        window.addEventListener('mousedown', (e) => { if (isPlaying && e.button === 0) isShooting = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 0) isShooting = false; });

        document.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * RENDER_SCALE, window.innerHeight * RENDER_SCALE, false);
        });

        const uiClock = document.getElementById('clock');
        const popupUI = document.getElementById('popup');
        let popupTimer = 0;

        function showPopup(text, color) {
            popupUI.innerText = text;
            popupUI.style.color = color;
            popupUI.style.opacity = 1;
            popupTimer = 3.0; 
        }

        function endGame(victory) {
            isPlaying = false;
            isGameOver = true;
            document.exitPointerLock();
            if (victory) {
                document.getElementById('victory-screen').style.display = 'flex';
            } else {
                document.getElementById('game-over-screen').style.display = 'flex';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const dt = clock.getDelta();
            gameTime += dt;

            if (popupTimer > 0) {
                popupTimer -= dt;
                if (popupTimer <= 0) popupUI.style.opacity = 0;
            }

            if (gameTime > nextPowerupTime) {
                spawnPowerup();
                nextPowerupTime = gameTime + 6 + Math.random() * 4;
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.mesh.rotation.y += dt * 2;
                p.mesh.position.y = 1.0 + Math.sin(gameTime * 3) * 0.2; 

                if (p.mesh.position.distanceTo(player.position) < 2.0) {
                    if (p.type === 'SPEED') {
                        playerSpeed *= 1.1;
                        showPopup("SPEED powerup activated!", "#0088ff");
                    } else if (p.type === 'RANGE') {
                        sprayRange *= 1.1;
                        showPopup("RANGE powerup activated!", "#ffff00");
                    } else if (p.type === 'FREEZE') {
                        freezeTimer = 5.0;
                        showPopup("FREEZE powerup activated!", "#00ffff");
                    } else if (p.type === 'NUKE') {
                        weeds.forEach(w => {
                            if (w.active) { w.active = false; w.mesh.visible = false; }
                        });
                        showPopup("NUKE powerup activated!", "#ff00ff");
                    }
                    scene.remove(p.mesh);
                    powerups.splice(i, 1);
                }
            }

            // AABB Collision Movement
            let moveX = 0;
            let moveZ = 0;
            if (keys.KeyW) moveZ -= 1;
            if (keys.KeyS) moveZ += 1;
            if (keys.KeyD) moveX += 1;
            if (keys.KeyA) moveX -= 1;
            
            if (moveX !== 0 || moveZ !== 0) {
                const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize();
                
                const deltaX = new THREE.Vector3(moveVec.x, 0, 0).applyEuler(new THREE.Euler(0, player.rotation.y, 0)).multiplyScalar(playerSpeed * dt);
                const deltaZ = new THREE.Vector3(0, 0, moveVec.z).applyEuler(new THREE.Euler(0, player.rotation.y, 0)).multiplyScalar(playerSpeed * dt);

                let nextPos = player.position.clone();
                
                nextPos.x += deltaX.x;
                nextPos.z += deltaX.z;
                playerBox.setFromCenterAndSize(new THREE.Vector3(nextPos.x, 1.25, player.position.z), playerBoxSize);
                if (!colliders.some(c => playerBox.intersectsBox(c))) {
                    player.position.x = nextPos.x;
                }

                playerBox.setFromCenterAndSize(new THREE.Vector3(player.position.x, 1.25, nextPos.z), playerBoxSize);
                if (!colliders.some(c => playerBox.intersectsBox(c))) {
                    player.position.z = nextPos.z;
                }
                
                player.position.x = Math.max(-48, Math.min(48, player.position.x));
                player.position.z = Math.max(-48, Math.min(48, player.position.z));
            }

            let growthMultiplier = 1.0;
            if (gameTime >= 55) {
                growthMultiplier = 3.0;
                uiClock.style.color = '#ff0000';
                
                if (!alert55Triggered) {
                    showPopup("ALERT: Countdown! Weeds growing 3x faster!", "#ff0000");
                    alert55Triggered = true;
                }
            } else if (gameTime >= 30) {
                growthMultiplier = 1.5;
                
                if (!alert30Triggered) {
                    showPopup("ALERT: Weeds are growing 1.5x faster!", "#ffaa00");
                    alert30Triggered = true;
                }
            }

            if (gameTime < 60) {
                let s = Math.floor(gameTime);
                let display = `0:${(s % 60).toString().padStart(2, '0')}`;
                if (gameTime >= 55) display += ` (${60 - s})`; 
                uiClock.innerText = display;
            } else {
                endGame(true); 
                return;
            }

            if (freezeTimer > 0) {
                freezeTimer -= dt;
            } else {
                if (Math.random() < 0.3 * dt * growthMultiplier && weeds.length < 50) spawnWeed();

                weeds.forEach(w => {
                    if (w.active) {
                        w.mesh.scale.y += 0.08 * growthMultiplier * dt;
                        
                        // Breathing animation for high visibility
                        const breath = 0.8 + Math.sin(gameTime * 5 + w.id) * 0.15;
                        w.mesh.scale.x = breath;
                        w.mesh.scale.z = breath;

                        if (w.mesh.scale.y >= FATAL_WEED_SIZE) {
                            endGame(false); 
                        }
                    }
                });
            }

            if (isShooting) {
                weeds.forEach(w => {
                    if (!w.active) return;
                    const dist = w.mesh.position.distanceTo(player.position);
                    if (dist < sprayRange) {
                        const dirToWeed = w.mesh.position.clone().sub(player.position).normalize();
                        const playerForward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, player.rotation.y, 0));
                        const dot = dirToWeed.dot(playerForward);
                        
                        if (dot > 0.4) { 
                            w.mesh.scale.y -= 15.0 * dt; 
                            if (w.mesh.scale.y <= 0.1) {
                                w.active = false;
                                w.mesh.visible = false;
                            }
                        }
                    }
                });

                const p = new THREE.Mesh(particleGeo, particleMat);
                const nozzlePos = new THREE.Vector3(0.7, 1.4, -1.8);
                player.localToWorld(nozzlePos);
                p.position.copy(nozzlePos);
                
                const pDir = new THREE.Vector3(0, 0, -1);
                pDir.applyEuler(new THREE.Euler(cameraPivot.rotation.x, player.rotation.y, 0));
                pDir.add(new THREE.Vector3((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3, 0)); 
                
                scene.add(p);
                particles.push({ mesh: p, dir: pDir, life: 0.6 });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.dir, 25 * dt);
                p.mesh.position.y -= 5 * dt; 
                p.life -= dt;
                
                if (p.life <= 0 || p.mesh.position.y < 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
