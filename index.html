<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            image-rendering: pixelated; /* Forces the pixelated look */
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #clock {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            background: #000000;
            padding: 10px 20px;
            border: 4px solid #ffffff;
        }
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
            color: white;
            text-align: center;
        }
        h1 {
            color: #7c8a04; 
            font-size: 64px; 
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #000;
        }
        p {
            font-size: 20px; 
            margin-bottom: 30px; 
            line-height: 1.5;
            max-width: 600px;
        }
        button {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #7c8a04;
            color: white;
            border: 4px solid #ffffff;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
        }
        button:active {
            background-color: #5a6603;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="clock">0:00</div>
    </div>
    
    <div id="start-screen" class="overlay-screen">
        <h1>Fertilizer 3D</h1>
        <p>
            Survive 60 seconds. Spray weeds before they grow too high.<br><br>
            <strong>W A S D</strong> to move.<br>
            <strong>Mouse</strong> to look.<br>
            <strong>Left Click</strong> to spray.
        </p>
        <button id="start-btn">Start Game</button>
    </div>

    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 style="color: #ff0000;">Game Over</h1>
        <p>A weed grew too high.</p>
        <button onclick="location.reload()">Restart</button>
    </div>

    <div id="victory-screen" class="overlay-screen" style="display: none;">
        <h1 style="color: #00ff00;">Farm Saved!</h1>
        <p>Congratulations. You survived 60 seconds.</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const FATAL_WEED_SIZE = 4.0;
        const RENDER_SCALE = 0.25; // Drastically reduces resolution for pixel art style

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

        // Low FOV for a retro look
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        // Set internal resolution low, CSS stretches it to fill screen
        renderer.setSize(window.innerWidth * RENDER_SCALE, window.innerHeight * RENDER_SCALE, false);
        renderer.domElement.style.width = '100vw';
        renderer.domElement.style.height = '100vh';
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap; // Hard pixelated shadows
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffdfaa, 1.0);
        dirLight.position.set(-20, 30, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 512;
        dirLight.shadow.mapSize.height = 512;
        scene.add(dirLight);

        // Environment (Blocky)
        const groundGeo = new THREE.BoxGeometry(100, 1, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x5a7a14 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        const sceneryGroup = new THREE.Group();

        // Blocky Barn
        const barnBase = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 16), new THREE.MeshLambertMaterial({ color: 0x8b2b2b }));
        barnBase.position.set(-20, 4, -30);
        barnBase.castShadow = true;
        barnBase.receiveShadow = true;
        const barnRoof = new THREE.Mesh(new THREE.BoxGeometry(18, 4, 18), new THREE.MeshLambertMaterial({ color: 0x333333 }));
        barnRoof.position.set(-20, 10, -30);
        barnRoof.castShadow = true;
        sceneryGroup.add(barnBase, barnRoof);

        // Blocky Fences
        const fenceMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
        for(let i=0; i<10; i++) {
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 0.5), fenceMat);
            post.position.set(20, 1, -20 + (i * 4));
            post.castShadow = true;
            sceneryGroup.add(post);
            if (i < 9) {
                const rail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 4), fenceMat);
                rail.position.set(20, 1.2, -18 + (i * 4));
                sceneryGroup.add(rail);
            }
        }
        scene.add(sceneryGroup);

        // --- PLAYER SETUP (3rd Person) ---
        const player = new THREE.Group();
        player.position.set(0, 0, 0);

        // Player Body Parts (Minecraft style)
        const pMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); // Blue overalls
        const sMat = new THREE.MeshLambertMaterial({ color: 0xffccaa }); // Skin
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), pMat);
        body.position.y = 1.25;
        body.castShadow = true;
        
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), sMat);
        head.position.y = 2.4;
        head.castShadow = true;
        
        const armRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), sMat);
        armRight.position.set(0.7, 1.4, -0.4); // Raised to hold gun
        armRight.rotation.x = -Math.PI / 2;
        armRight.castShadow = true;

        // Blocky Gun
        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 1.5), new THREE.MeshLambertMaterial({ color: 0x333333 }));
        gun.position.set(0.7, 1.4, -1.0);
        gun.castShadow = true;
        const tank = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.5), new THREE.MeshLambertMaterial({ color: 0x00ff00 }));
        tank.position.set(0.7, 1.7, -0.7);

        player.add(body, head, armRight, gun, tank);
        scene.add(player);

        // Camera Pivot Setup
        const cameraPivot = new THREE.Group();
        cameraPivot.position.set(0, 2, 0); // Eye level pivot
        player.add(cameraPivot);
        
        camera.position.set(0, 1.5, 5); // Behind and slightly up
        camera.lookAt(0, 0, -5);
        cameraPivot.add(camera);

        // --- WEEDS ---
        const weeds = [];
        const weedGeo = new THREE.BoxGeometry(1, 1, 1);
        weedGeo.translate(0, 0.5, 0); // Scale from bottom
        const weedMat = new THREE.MeshLambertMaterial({ color: 0x7c8a04 });

        function spawnWeed() {
            const weed = new THREE.Mesh(weedGeo, weedMat);
            const x = (Math.random() - 0.5) * 40;
            const z = (Math.random() - 0.5) * 40; 
            weed.position.set(x, 0, z);
            weed.scale.set(0.8, 0.2, 0.8);
            weed.castShadow = true;
            weed.receiveShadow = true;
            
            scene.add(weed);
            weeds.push({ mesh: weed, active: true });
        }

        // Initial weeds
        for (let i = 0; i < 15; i++) spawnWeed();

        let isShooting = false;
        let gameTime = 0;
        let isPlaying = false;
        let isGameOver = false;
        
        const clock = new THREE.Clock();
        
        const particles = [];
        const particleGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0x88ccff });

        let yaw = 0;
        let pitch = 0;
        const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };

        document.getElementById('start-btn').addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (isGameOver) return;
            if (document.pointerLockElement === document.body) {
                document.getElementById('start-screen').style.display = 'none';
                isPlaying = true;
                clock.start();
            } else {
                document.getElementById('start-screen').style.display = 'flex';
                isPlaying = false;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const sensitivity = 0.003;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, pitch)); // Restrict vertical look
            
            player.rotation.y = yaw;
            cameraPivot.rotation.x = pitch;
        });

        window.addEventListener('mousedown', (e) => { if (isPlaying && e.button === 0) isShooting = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 0) isShooting = false; });

        document.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * RENDER_SCALE, window.innerHeight * RENDER_SCALE, false);
        });

        const uiClock = document.getElementById('clock');

        function endGame(victory) {
            isPlaying = false;
            isGameOver = true;
            document.exitPointerLock();
            if (victory) {
                document.getElementById('victory-screen').style.display = 'flex';
            } else {
                document.getElementById('game-over-screen').style.display = 'flex';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const dt = clock.getDelta();
            gameTime += dt;

            // Fast Player Movement
            const speed = 15.0; 
            const moveDir = new THREE.Vector3();
            if (keys.KeyW) moveDir.z -= 1;
            if (keys.KeyS) moveDir.z += 1;
            if (keys.KeyD) moveDir.x += 1;
            if (keys.KeyA) moveDir.x -= 1;
            
            if (moveDir.lengthSq() > 0) {
                moveDir.normalize();
                // Apply player's current rotation to movement
                moveDir.applyEuler(new THREE.Euler(0, player.rotation.y, 0));
                player.position.addScaledVector(moveDir, speed * dt);
                
                // Keep player in bounds
                player.position.x = Math.max(-48, Math.min(48, player.position.x));
                player.position.z = Math.max(-48, Math.min(48, player.position.z));
            }

            // Easy difficulty weed growth
            const growthRate = 0.08; 

            if (gameTime < 60) {
                let s = Math.floor(gameTime);
                uiClock.innerText = `0:${(s % 60).toString().padStart(2, '0')}`;
            } else {
                endGame(true); // Victory
                return;
            }

            // Occasional spawn
            if (Math.random() < 0.3 * dt && weeds.length < 30) spawnWeed();

            weeds.forEach(w => {
                if (w.active) {
                    w.mesh.scale.y += growthRate * dt;
                    if (w.mesh.scale.y >= FATAL_WEED_SIZE) {
                        endGame(false); // Fail
                    }
                }
            });

            // Forgiving Area-of-Effect Spray Mechanics
            if (isShooting) {
                const sprayRange = 12.0; 
                
                weeds.forEach(w => {
                    if (!w.active) return;
                    // Calculate distance to player
                    const dist = w.mesh.position.distanceTo(player.position);
                    if (dist < sprayRange) {
                        // Check if weed is roughly in front of player
                        const dirToWeed = w.mesh.position.clone().sub(player.position).normalize();
                        const playerForward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, player.rotation.y, 0));
                        const dot = dirToWeed.dot(playerForward);
                        
                        // Wide angle cone (dot > 0 = 180 degrees in front)
                        if (dot > 0.2) {
                            w.mesh.scale.y -= 15.0 * dt; // Melts weeds instantly
                            if (w.mesh.scale.y <= 0.1) {
                                w.active = false;
                                w.mesh.visible = false;
                            }
                        }
                    }
                });

                // Particles
                const p = new THREE.Mesh(particleGeo, particleMat);
                const nozzlePos = new THREE.Vector3(0.7, 1.4, -1.8);
                player.localToWorld(nozzlePos);
                p.position.copy(nozzlePos);
                
                const pDir = new THREE.Vector3(0, 0, -1);
                pDir.applyEuler(new THREE.Euler(cameraPivot.rotation.x, player.rotation.y, 0));
                pDir.add(new THREE.Vector3((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3, 0)); // Wide spread
                
                scene.add(p);
                particles.push({ mesh: p, dir: pDir, life: 0.6 });
            }

            // Particle Physics
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.dir, 25 * dt);
                p.mesh.position.y -= 5 * dt; 
                p.life -= dt;
                
                if (p.life <= 0 || p.mesh.position.y < 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
