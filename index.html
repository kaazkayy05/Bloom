<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer Simulator 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9e3cc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #clock {
            font-size: 32px;
            font-weight: bold;
            color: #7c8a04;
            background: rgba(249, 227, 204, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid #daa056;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            border: 1px solid #333;
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(245, 204, 186, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
        }
        button {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #daa056;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="clock">0:00</div>
    </div>
    <div id="crosshair"></div>
    <div id="start-screen">
        <h1 style="color: #7c8a04; font-size: 54px; margin-bottom: 10px;">Soft Farm</h1>
        <p style="color: #333; font-size: 20px; margin-bottom: 30px; text-align: center;">
            <strong>W A S D</strong> to walk.<br>
            <strong>Mouse</strong> to look around.<br>
            <strong>Left Click</strong> (Hold) to spray fertilizer.
        </p>
        <button id="start-btn">Click to Start</button>
    </div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Palette
        const C_WEEDS = 0x7c8a04;
        const C_SKY_TOP = 0xf9e3cc;
        const C_SKY_BOT = 0xf5ccba;
        const C_BUILDINGS = 0xc2cada;
        const C_SUN = 0xdaa056;
        const C_DIRT = 0xa37b45;

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(C_SKY_BOT);
        scene.fog = new THREE.Fog(C_SKY_BOT, 10, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.5, 0); // Player height

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(C_SKY_TOP, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(C_SUN, 1.2);
        // Positioned low for sunset shadows, facing away from origin
        dirLight.position.set(-20, 15, 30);
        dirLight.castShadow = true;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -40;
        dirLight.shadow.camera.right = 40;
        dirLight.shadow.camera.top = 40;
        dirLight.shadow.camera.bottom = -40;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Environment (Farm Ground)
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: C_DIRT, roughness: 1.0 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Background Scenery
        const sceneryGroup = new THREE.Group();
        const bldgMat = new THREE.MeshStandardMaterial({ color: C_BUILDINGS, roughness: 0.8 });
        
        function addHouse(x, z, w, h, d) {
            const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMat);
            box.position.set(x, h/2, z);
            box.castShadow = true;
            box.receiveShadow = true;
            
            const roofGeo = new THREE.ConeGeometry(w*0.8, h*0.5, 4);
            const roofMat = new THREE.MeshStandardMaterial({color: 0x8a5a44, roughness: 0.9});
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(x, h + (h*0.5)/2, z);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            
            sceneryGroup.add(box);
            sceneryGroup.add(roof);
        }

        function addPole(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 8), bldgMat);
            pole.position.set(x, 4, z);
            pole.castShadow = true;
            
            const light = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: C_SUN}));
            light.position.set(x, 8, z + 0.5);
            sceneryGroup.add(pole);
            sceneryGroup.add(light);
        }

        // Generate farm structures
        addHouse(-20, -30, 8, 6, 8);
        addHouse(25, -40, 10, 7, 10);
        addHouse(-35, 10, 6, 5, 6);
        addPole(-15, -20);
        addPole(15, -25);
        addPole(-20, 5);
        addPole(20, 20);
        scene.add(sceneryGroup);

        // Player / Gun Model
        const gunGroup = new THREE.Group();
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.8), barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0, -0.4);
        
        const tankMat = new THREE.MeshStandardMaterial({ color: C_SUN, roughness: 0.3 });
        const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.4), tankMat);
        tank.position.set(0, -0.1, -0.1);
        
        gunGroup.add(barrel);
        gunGroup.add(tank);
        
        // Attach gun directly to camera
        gunGroup.position.set(0.3, -0.3, -0.6);
        camera.add(gunGroup);
        scene.add(camera);

        // Weeds System
        const weeds = [];
        const weedGeo = new THREE.ConeGeometry(0.4, 1.2, 6);
        weedGeo.translate(0, 0.6, 0); 
        const weedMat = new THREE.MeshStandardMaterial({ color: C_WEEDS, roughness: 0.9 });

        function spawnWeed() {
            const weed = new THREE.Mesh(weedGeo, weedMat);
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80; 
            weed.position.set(x, 0, z);
            weed.scale.setScalar(0.1);
            weed.castShadow = true;
            weed.receiveShadow = true;
            
            scene.add(weed);
            weeds.push({ mesh: weed, active: true, maxSize: 1 + Math.random() * 2.0 });
        }

        // Populate initial field
        for (let i = 0; i < 100; i++) spawnWeed();

        // Game State
        let isShooting = false;
        let gameTime = 0;
        let isPlaying = false;
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);
        
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.04, 4, 4);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0x88ccff });

        // FPS Controls State
        let yaw = 0;
        let pitch = 0;
        const keys = { w: false, a: false, s: false, d: false };

        // Pointer Lock & Input
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');

        startBtn.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                startScreen.style.display = 'none';
                isPlaying = true;
                clock.start();
            } else {
                startScreen.style.display = 'flex';
                isPlaying = false;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            
            // Clamp pitch to prevent flipping
            pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
            
            // Apply rotations
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        window.addEventListener('mousedown', (e) => { if (isPlaying && e.button === 0) isShooting = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 0) isShooting = false; });

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const uiClock = document.getElementById('clock');

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const dt = clock.getDelta();
            gameTime += dt;

            // Player Movement
            const speed = 8.0 * dt;
            const moveDir = new THREE.Vector3();
            
            // Get forward vector (ignoring pitch for flat walking)
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ')));
            // Get right vector
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ')));

            if (keys.w) moveDir.add(forward);
            if (keys.s) moveDir.sub(forward);
            if (keys.d) moveDir.add(right);
            if (keys.a) moveDir.sub(right);
            
            moveDir.normalize();
            camera.position.addScaledVector(moveDir, speed);

            // Difficulty & Timeline Logic
            let growthRate = 0.3;
            if (gameTime >= 55) {
                growthRate = 1.5;
                uiClock.style.color = '#d32f2f'; // Alert color
            } else if (gameTime >= 30) {
                growthRate = 0.8;
            }

            // Update UI Timer
            if (gameTime < 60) {
                let s = Math.floor(gameTime);
                let display = `0:${(s % 60).toString().padStart(2, '0')}`;
                if (gameTime >= 55) display += ` (0:0${60 - s})`;
                uiClock.innerText = display;
            } else {
                uiClock.innerText = "1:00 - Complete";
                isShooting = false;
                growthRate = 0;
            }

            // Continuous Weed Growth & Spawning
            if (Math.random() < growthRate * dt * 3 && gameTime < 60) spawnWeed();

            weeds.forEach(w => {
                if (w.active && w.mesh.scale.y < w.maxSize) {
                    w.mesh.scale.addScalar(growthRate * dt);
                }
            });

            // Shooting Mechanics
            if (isShooting) {
                raycaster.setFromCamera(centerScreen, camera);
                const activeMeshes = weeds.filter(w => w.active).map(w => w.mesh);
                const intersects = raycaster.intersectObjects(activeMeshes);

                if (intersects.length > 0) {
                    const hitMesh = intersects[0].object;
                    const weedData = weeds.find(w => w.mesh === hitMesh);
                    if (weedData) {
                        weedData.mesh.scale.subScalar(4.0 * dt);
                        if (weedData.mesh.scale.y <= 0.1) {
                            weedData.active = false;
                            weedData.mesh.visible = false;
                        }
                    }
                }

                // Fertilizer Particles
                const p = new THREE.Mesh(particleGeo, particleMat);
                
                // Spawn at gun nozzle
                const nozzlePos = new THREE.Vector3(0, 0, -0.8);
                gunGroup.localToWorld(nozzlePos);
                p.position.copy(nozzlePos);
                
                // Shoot slightly randomized forward direction
                const pDir = new THREE.Vector3();
                camera.getWorldDirection(pDir);
                pDir.add(new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, 0));
                
                scene.add(p);
                particles.push({ mesh: p, dir: pDir, life: 0.8 });
                
                // Gun recoil animation
                gunGroup.position.z = -0.58 + (Math.random() * 0.02);
            } else {
                gunGroup.position.z = -0.6; // Reset gun position
            }

            // Physics for particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.dir, 20 * dt);
                p.mesh.position.y -= 4 * dt; // Gravity arc
                p.life -= dt;
                
                if (p.life <= 0 || p.mesh.position.y < 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
