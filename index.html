<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Farm - FPS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9e3cc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #clock {
            font-size: 32px;
            font-weight: bold;
            color: #7c8a04;
            background: rgba(249, 227, 204, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid #daa056;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            border: 1px solid #333;
        }
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(245, 204, 186, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
        }
        h1 {
            color: #7c8a04; 
            font-size: 54px; 
            margin-bottom: 10px;
        }
        p {
            color: #333; 
            font-size: 20px; 
            margin-bottom: 30px; 
            text-align: center;
            line-height: 1.5;
        }
        button {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #daa056;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="clock">0:00</div>
    </div>
    <div id="crosshair"></div>
    
    <div id="start-screen" class="overlay-screen">
        <h1>Soft Farm</h1>
        <p>
            <strong>Objective:</strong> Spray the weeds before any of them grow too large!<br><br>
            <strong>W A S D</strong> to walk.<br>
            <strong>Mouse</strong> to look around.<br>
            <strong>Left Click</strong> (Hold) to spray fertilizer.<br>
            <strong>ESC</strong> to pause the game.
        </p>
        <button id="start-btn">Click to Start / Resume</button>
    </div>

    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 style="color: #d32f2f;">Game Over</h1>
        <p>A weed grew out of control and ruined the farm.</p>
        <button onclick="location.reload()">Restart Game</button>
    </div>

    <div id="victory-screen" class="overlay-screen" style="display: none;">
        <h1 style="color: #5a7a14;">Farm Saved</h1>
        <p>You survived 60 seconds.</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const C_WEEDS = 0x7c8a04;
        const C_SKY_TOP = 0xf9e3cc;
        const C_SKY_BOT = 0xf5ccba;
        const C_SUN = 0xdaa056;
        const C_DIRT = 0x6e5229;
        const C_GRASS = 0x5a7a14;
        const C_BARN = 0x8b2b2b;
        const C_WHEAT = 0xd4b857;
        const C_TRACTOR = 0x2d6b38;

        const FATAL_WEED_SIZE = 3.5;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(C_SKY_BOT);
        scene.fog = new THREE.Fog(C_SKY_BOT, 10, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.5, 0); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(C_SKY_TOP, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(C_SUN, 1.2);
        dirLight.position.set(-20, 15, 30);
        dirLight.castShadow = true;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: C_DIRT, roughness: 1.0 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grass height reduced to 0.25
        const grassGeo = new THREE.PlaneGeometry(0.35, 0.25);
        grassGeo.translate(0, 0.125, 0); 
        const grassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.8 });
        const grassCount = 60000;
        const grassMesh = new THREE.InstancedMesh(grassGeo, grassMat, grassCount);
        grassMesh.receiveShadow = true;
        
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        
        for (let i = 0; i < grassCount; i++) {
            dummy.position.set((Math.random() - 0.5) * 120, 0, (Math.random() - 0.5) * 120);
            dummy.rotation.y = Math.random() * Math.PI;
            
            const scale = 0.6 + Math.random() * 0.8;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            grassMesh.setMatrixAt(i, dummy.matrix);
            
            color.setHex(C_GRASS);
            color.lerp(new THREE.Color(0x7c9a14), Math.random() * 0.5); 
            grassMesh.setColorAt(i, color);
        }
        scene.add(grassMesh);

        const sceneryGroup = new THREE.Group();

        const barnBase = new THREE.Mesh(new THREE.BoxGeometry(12, 7, 16), new THREE.MeshStandardMaterial({ color: C_BARN }));
        barnBase.position.set(-20, 3.5, -30);
        barnBase.castShadow = true;
        barnBase.receiveShadow = true;
        
        const barnRoof = new THREE.Mesh(new THREE.ConeGeometry(11, 6, 4), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        barnRoof.position.set(-20, 10, -30);
        barnRoof.rotation.y = Math.PI / 4;
        barnRoof.castShadow = true;
        
        sceneryGroup.add(barnBase, barnRoof);

        const tractor = new THREE.Group();
        const tEngine = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 4), new THREE.MeshStandardMaterial({ color: C_TRACTOR }));
        tEngine.position.set(0, 1.5, 1);
        const tCab = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3, 2.5), new THREE.MeshStandardMaterial({ color: C_TRACTOR }));
        tCab.position.set(0, 2.5, -1.5);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wheelGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.5, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        
        const w1 = new THREE.Mesh(wheelGeo, wheelMat); w1.position.set(1.5, 0.8, 1.5);
        const w2 = new THREE.Mesh(wheelGeo, wheelMat); w2.position.set(-1.5, 0.8, 1.5);
        const w3 = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.6, 16).rotateZ(Math.PI/2), wheelMat); w3.position.set(1.6, 1.2, -1.5);
        const w4 = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.6, 16).rotateZ(Math.PI/2), wheelMat); w4.position.set(-1.6, 1.2, -1.5);
        
        tractor.add(tEngine, tCab, w1, w2, w3, w4);
        tractor.position.set(15, 0, -25);
        tractor.rotation.y = -Math.PI / 3;
        tractor.traverse(child => { if(child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
        sceneryGroup.add(tractor);

        const wheatGeo = new THREE.CylinderGeometry(0.05, 0.05, 2);
        wheatGeo.translate(0, 1, 0);
        const wheatMat = new THREE.MeshStandardMaterial({ color: C_WHEAT });
        const wheatInstanced = new THREE.InstancedMesh(wheatGeo, wheatMat, 400);
        for(let i=0; i<400; i++) {
            dummy.position.set(20 + (Math.random()-0.5)*15, 0, -10 + (Math.random()-0.5)*15);
            dummy.rotation.set((Math.random()-0.5)*0.2, Math.random()*Math.PI, (Math.random()-0.5)*0.2);
            dummy.updateMatrix();
            wheatInstanced.setMatrixAt(i, dummy.matrix);
        }
        sceneryGroup.add(wheatInstanced);

        const cow = new THREE.Group();
        const cowBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 2.5), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
        cowBody.position.y = 1.5;
        const cowHead = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 1), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        cowHead.position.set(0, 2, 1.5);
        const legGeo = new THREE.CylinderGeometry(0.15, 0.1, 1);
        const leg1 = new THREE.Mesh(legGeo, cowBody.material); leg1.position.set(0.6, 0.5, 1);
        const leg2 = new THREE.Mesh(legGeo, cowBody.material); leg2.position.set(-0.6, 0.5, 1);
        const leg3 = new THREE.Mesh(legGeo, cowBody.material); leg3.position.set(0.6, 0.5, -1);
        const leg4 = new THREE.Mesh(legGeo, cowBody.material); leg4.position.set(-0.6, 0.5, -1);
        cow.add(cowBody, cowHead, leg1, leg2, leg3, leg4);
        cow.position.set(-15, 0, -10);
        cow.rotation.y = Math.PI / 4;
        cow.traverse(child => { if(child.isMesh) { child.castShadow = true; } });
        sceneryGroup.add(cow);

        const dog = new THREE.Group();
        const dogBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 1.2), new THREE.MeshStandardMaterial({ color: 0xcd853f }));
        dogBody.position.y = 0.5;
        const dogHead = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.5), new THREE.MeshStandardMaterial({ color: 0xcd853f }));
        dogHead.position.set(0, 0.8, 0.7);
        dog.add(dogBody, dogHead);
        dog.position.set(5, 0, -5);
        dog.traverse(child => { if(child.isMesh) { child.castShadow = true; } });
        sceneryGroup.add(dog);

        scene.add(sceneryGroup);

        const gunGroup = new THREE.Group();
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.8), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0, -0.4);
        
        const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.4), new THREE.MeshStandardMaterial({ color: 0x2288cc }));
        tank.position.set(0, -0.1, -0.1);
        
        gunGroup.add(barrel, tank);
        gunGroup.position.set(0.3, -0.3, -0.6);
        camera.add(gunGroup);
        scene.add(camera);

        const weeds = [];
        const weedGeo = new THREE.ConeGeometry(0.4, 1.2, 6);
        weedGeo.translate(0, 0.6, 0); 
        const weedMat = new THREE.MeshStandardMaterial({ color: C_WEEDS, roughness: 0.9 });

        function spawnWeed() {
            const weed = new THREE.Mesh(weedGeo, weedMat);
            const x = (Math.random() - 0.5) * 15;
            const z = (Math.random() - 0.5) * 15; 
            weed.position.set(x, 0, z);
            // Spawn size increased to 0.2
            weed.scale.setScalar(0.2);
            weed.castShadow = true;
            weed.receiveShadow = true;
            
            scene.add(weed);
            weeds.push({ mesh: weed, active: true });
        }

        for (let i = 0; i < 40; i++) spawnWeed();

        let isShooting = false;
        let gameTime = 0;
        let isPlaying = false;
        let isGameOver = false;
        
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);
        
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.04, 4, 4);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0x88ccff });

        let yaw = 0;
        let pitch = 0;
        const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };

        document.getElementById('start-btn').addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (isGameOver) return;
            
            if (document.pointerLockElement === document.body) {
                document.getElementById('start-screen').style.display = 'none';
                isPlaying = true;
                clock.start();
            } else {
                document.getElementById('start-screen').style.display = 'flex';
                isPlaying = false;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        window.addEventListener('mousedown', (e) => { if (isPlaying && e.button === 0) isShooting = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 0) isShooting = false; });

        document.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });
        document.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const uiClock = document.getElementById('clock');

        function triggerGameOver() {
            isPlaying = false;
            isGameOver = true;
            document.exitPointerLock();
            document.getElementById('game-over-screen').style.display = 'flex';
        }
        
        function triggerVictory() {
            isPlaying = false;
            isGameOver = true;
            document.exitPointerLock();
            document.getElementById('victory-screen').style.display = 'flex';
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const dt = clock.getDelta();
            gameTime += dt;

            const speed = 12.0 * dt;
            const moveDir = new THREE.Vector3();
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ')));
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ')));

            if (keys.KeyW) moveDir.add(forward);
            if (keys.KeyS) moveDir.sub(forward);
            if (keys.KeyD) moveDir.add(right);
            if (keys.KeyA) moveDir.sub(right);
            
            moveDir.normalize();
            camera.position.addScaledVector(moveDir, speed);

            const dogSpeed = 2.0;
            const dogPathX = Math.sin(gameTime * 0.5) * 10;
            const dogPathZ = Math.cos(gameTime * 0.3) * 10;
            const targetPos = new THREE.Vector3(dogPathX, 0, dogPathZ - 10);
            
            const dirToTarget = targetPos.clone().sub(dog.position).normalize();
            dog.position.addScaledVector(dirToTarget, dogSpeed * dt);
            
            if (dirToTarget.lengthSq() > 0.001) {
                const targetAngle = Math.atan2(dirToTarget.x, dirToTarget.z);
                dog.rotation.y = targetAngle;
            }

            let growthRate = 0.15;
            if (gameTime >= 55) {
                growthRate = 0.75;
                uiClock.style.color = '#d32f2f';
            } else if (gameTime >= 30) {
                growthRate = 0.4;
            }

            if (gameTime < 60) {
                let s = Math.floor(gameTime);
                let display = `0:${(s % 60).toString().padStart(2, '0')}`;
                if (gameTime >= 55) display += ` (0:0${60 - s})`;
                uiClock.innerText = display;
            } else {
                triggerVictory();
                return;
            }

            if (Math.random() < growthRate * dt * 3 && gameTime < 60) spawnWeed();

            weeds.forEach(w => {
                if (w.active) {
                    w.mesh.scale.addScalar(growthRate * dt);
                    
                    if (w.mesh.scale.y >= FATAL_WEED_SIZE) {
                        triggerGameOver();
                    }
                }
            });

            if (isShooting) {
                raycaster.setFromCamera(centerScreen, camera);
                const activeMeshes = weeds.filter(w => w.active).map(w => w.mesh);
                const intersects = raycaster.intersectObjects(activeMeshes);

                if (intersects.length > 0) {
                    const hitMesh = intersects[0].object;
                    const weedData = weeds.find(w => w.mesh === hitMesh);
                    if (weedData) {
                        weedData.mesh.scale.subScalar(15.0 * dt);
                        if (weedData.mesh.scale.y <= 0.1) {
                            weedData.active = false;
                            weedData.mesh.visible = false;
                        }
                    }
                }

                const p = new THREE.Mesh(particleGeo, particleMat);
                const nozzlePos = new THREE.Vector3(0, 0, -0.8);
                gunGroup.localToWorld(nozzlePos);
                p.position.copy(nozzlePos);
                
                const pDir = new THREE.Vector3();
                camera.getWorldDirection(pDir);
                pDir.add(new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, 0));
                
                scene.add(p);
                particles.push({ mesh: p, dir: pDir, life: 0.8 });
                gunGroup.position.z = -0.58 + (Math.random() * 0.02);
            } else {
                gunGroup.position.z = -0.6; 
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.dir, 20 * dt);
                p.mesh.position.y -= 4 * dt; 
                p.life -= dt;
                
                if (p.life <= 0 || p.mesh.position.y < 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
